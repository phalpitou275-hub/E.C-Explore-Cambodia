<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>តំបន់ទេសចរណ៍កម្ពុជា</title>
    <link rel="stylesheet" href="index.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #eef9ff;
        }

        header {
            background: #006994;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px #bbb;
        }

        img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .content {
            padding: 20px;
        }

        h2 {
            color: #006994;
        }

        @media(max-width: 800px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🏝️ តំបន់ទេសចរណ៍កម្ពុជា</h1>
    <p>កន្លែងស្អាតៗដែលគួរទៅទស្សនា</p>
</header>

<div class="container">

    <div class="card">
        <img src="../img/សៀមរាប.jpg">

        <div class="content">
            <h2>🏛️ សៀមរាប</h2>
            <p>
                សៀមរាបជាទីក្រុងទេសចរណ៍ដ៏សំខាន់
                និងជាទីតាំងនៃប្រាសាទអង្គរដ៏អស្ចារ្យ។
            </p>
        </div>
    </div>

    <div class="card">
        <img src="../img/កោះរ៉ុង.jpg">

        <div class="content">
            <h2>🏝️ កោះរ៉ុង</h2>
            <p>
                កោះរ៉ុងមានឆ្នេរខ្សាច់ស និងទឹកសមុទ្រថ្លា
                សាកសមសម្រាប់ការសម្រាកលំហែ។
            </p>
        </div>
    </div>

    <div class="card">
        <img src="../img/កំពត.jpg">

        <div class="content">
            <h2>🌴 កំពត</h2>
            <p>
                កំពតល្បីដោយទេសភាពធម្មជាតិ
                ភ្នំបូកគោ និងម្រេចកំពត។
            </p>
        </div>
    </div>

</div>

</body>
</html>
