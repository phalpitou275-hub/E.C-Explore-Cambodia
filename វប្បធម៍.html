<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>វប្បធម៌ខ្មែរ</title>
    <link rel="stylesheet" href="index.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #fff8e7;
        }

        header {
            background: #8b0000;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #ccc;
        }

        h2 {
            color: #8b0000;
        }

        img {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<header>
    <h1>🇰🇭 វប្បធម៌ខ្មែរ</h1>
    <p>ស្វែងយល់ពីវប្បធម៌ដ៏សម្បូរបែបរបស់កម្ពុជា</p>
</header>

<div class="container">

    <div class="card">
        <img src="../img/វប្បធម៍.jpg" alt="">

        <h2>🏛️ ប្រាសាទអង្គរវត្ត</h2>

        <p>
            ប្រាសាទអង្គរវត្ត គឺជាមរតកវប្បធម៌ដ៏សំខាន់របស់កម្ពុជា
            និងជានិមិត្តសញ្ញាដ៏ល្បីល្បាញរបស់ប្រទេស។
        </p>
    </div>

    <div class="card">
        <h2>🎭 សិល្បៈខ្មែរ</h2>

        <p>
            សិល្បៈខ្មែររួមមាន របាំបុរាណ តន្ត្រី ចម្លាក់
            និងស្ថាបត្យកម្ម ដែលបានបន្តពីជំនាន់មួយទៅជំនាន់មួយ។
        </p>
    </div>

</div>

</body>
</html>
