<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ម្ហូបអាហារខ្មែរ</title>
    <link rel="stylesheet" href="index.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #fffaf0;
        }

        header {
            background: #d2691e;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .food {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px #ccc;
            transition: 0.3s;
        }

        .food:hover {
            transform: translateY(-8px);
        }

        .food img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .content {
            padding: 20px;
        }

        h2 {
            color: #d2691e;
        }

        @media(max-width: 800px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🍜 ម្ហូបអាហារខ្មែរ</h1>
    <p>ស្វែងយល់ពីរសជាតិដ៏ពិសេសរបស់កម្ពុជា</p>
</header>

<div class="container">

    <div class="food">

        <img src="../img/Fish_Amok_with_Rice.jpg">

        <div class="content">
            <h2>🍛 អាម៉ុក</h2>

            <p>
                អាម៉ុកជាម្ហូបខ្មែរដ៏ល្បី
                ដែលមានរសជាតិឈ្ងុយឆ្ងាញ់ និងមានគ្រឿងផ្សំជាច្រើន។
            </p>
        </div>

    </div>


    <div class="food">

        <img src="../img/នំបញ្ចុក.jpg">

        <div class="content">
            <h2>🍜 នំបញ្ចុក</h2>

            <p>
                នំបញ្ចុកជាអាហារប្រពៃណីខ្មែរ
                ដែលមានប្រជាប្រិយភាព និងមានរសជាតិឆ្ងាញ់។
            </p>
        </div>

    </div>


    <div class="food">

        <img src="../img/បាយសាច់ជ្រូក.jpg">

        <div class="content">
            <h2>🍚 បាយសាច់ជ្រូក</h2>

            <p>
                បាយសាច់ជ្រូកជាអាហារពេលព្រឹក
                ដែលពេញនិយមនៅក្នុងប្រទេសកម្ពុជា។
            </p>
        </div>

    </div>

</div>

</body>
</html>
